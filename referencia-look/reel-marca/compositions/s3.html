  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      const count = (id, from, to, t, d) => {
        const el = document.getElementById(id);
        const o = { v: from };
        tl.fromTo(o, { v: from }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = Math.round(o.v)) }, t);
      };
      const hud = (sel, t) =>
        tl.fromTo(sel + " > *", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out", stagger: 0.06 }, t);

      // A · llega del barrido de la escena anterior y la luz sube con el dimmer.
      tl.fromTo("#s3-a-cam", { x: -330 }, { x: -735, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#s3-a-cam", { x: -735 }, { x: -800, duration: 1.2, ease: "none", immediateRender: false }, 0.6);
      tl.fromTo("#s3-dim", { opacity: 0.72 }, { opacity: 0, duration: 1.1, ease: "power2.out" }, 0.25);
      hud("#s3-a-hud", 0.12);
      count("s3-a-n", 0, 80, 0.25, 1.1);
      tl.fromTo("#s3-a-bar", { scaleX: 0 }, { scaleX: 0.8, duration: 1.1, ease: "power2.out" }, 0.25);

      // B · las cortinas suben y entra la luz del atardecer.
      tl.fromTo("#s3-b-cam", { x: -60, scale: 1.0 }, { x: -230, scale: 1.0, duration: 1.8, ease: "power1.out" }, 1.8);
      tl.fromTo("#s3-b-lit", { "--p": "-20%" }, { "--p": "100%", duration: 1.25, ease: "power2.inOut" }, 1.9);
      hud("#s3-b-hud", 1.86);
      count("s3-b-n", 0, 100, 1.9, 1.25);
      tl.fromTo("#s3-b-bar", { scaleX: 0 }, { scaleX: 1, duration: 1.25, ease: "power2.inOut" }, 1.9);

      // C · clima.
      tl.fromTo("#s3-c-cam", { x: -640, y: -40, scale: 1.1 }, { x: -560, y: 0, scale: 1.0, duration: 1.2, ease: "power2.out" }, 3.6);
      hud("#s3-c-hud", 3.66);
      count("s3-c-n", 26, 22, 3.75, 0.8);
      tl.fromTo("#s3-c-bar", { scaleX: 0.9 }, { scaleX: 0.55, duration: 0.8, ease: "power2.out" }, 3.75);

      // Texto: se queda quieto mientras cambian los mundos detrás.
      tl.fromTo(
        "#s3-text .ah-hl .w",
        { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.12 },
        0.3,
      );
      tl.fromTo(
        "#s3-lede .w",
        { opacity: 0, filter: "blur(8px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out", stagger: 0.08 },
        1.85,
      );

      // Corte con caída a negro.
      tl.fromTo("#s3-dip", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.in" }, 4.6);

      window.__timelines["s3"] = tl;
    })();
  </script>
