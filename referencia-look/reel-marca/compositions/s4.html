      const blurIn = (sel, t, d = 0.4, st = 0) =>

      tl.fromTo("#s4-enter", { opacity: 1 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0);

      // A · la cámara encuadra la entrada: el marco se cierra sobre el acceso.

        ["#s4-c1", 96, 420, 560, 420],
        ["#s4-c2", 920, 420, 840, 420],
        ["#s4-c3", 96, 960, 560, 800],
        ["#s4-c4", 920, 960, 840, 800],

        tl.fromTo(sel, { x: x0, y: y0, opacity: 0 }, { x: x0, y: y0, opacity: 1, duration: 0.25, ease: "power2.out" }, 0.25);
        tl.fromTo(sel, { x: x0, y: y0 }, { x: x1, y: y1, duration: 0.75, ease: "power3.inOut", immediateRender: false }, 0.6);
      });
      blurIn("#s4-a-hud .ah-mono", 0.3);
      tl.fromTo("#s4-rec", { opacity: 1 }, { opacity: 0.15, duration: 1.8, ease: "steps(3)" }, 0.6);
      blurIn("#s4-a-val", 1.3);

      // B · cerradura: el anillo se completa sobre el lector y autoriza.
      gsap.set("#s4-b-cam", { transformOrigin: "74% 63%" });
      tl.fromTo("#s4-b-cam", { scale: 1.14, y: 0 }, { scale: 1.0, y: 0, duration: 2.0, ease: "power2.out" }, 2.4);
      blurIn("#s4-b-hud .ah-mono", 2.5);

      tl.fromTo("#s4-ring-c", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 2.8);
      blurIn("#s4-b-val", 3.45);

      // Texto fijo sobre los dos planos.
      blurIn("#s4-text .ah-hl .w", 0.4, 0.5, 0.12);
      blurIn("#s4-lede .w", 1.2, 0.45, 0.08);

      // Salida: el anillo se abre y se convierte en el próximo mundo.
