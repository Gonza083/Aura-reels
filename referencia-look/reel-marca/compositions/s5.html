  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      // Entrada: el anillo de la cerradura se cierra sobre el corazón de la red.

      // El plano de la casa, en perspectiva, gira lentamente.

      tl.fromTo(
        "#s5-plane",
        { rotationX: 57, rotationZ: -36, scale: 0.74 },
        { rotationX: 55, rotationZ: -20, scale: 0.82, duration: 4.8, ease: "none" },

      tl.fromTo("#s5-grid", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.2);

      tl.fromTo("#s5-rack", { scale: 0, transformOrigin: "50% 50%" }, { scale: 1, duration: 0.45, ease: "back.out(2)" }, 0.3);
      tl.fromTo(
        "#s5-svg .wall",
        { strokeDashoffset: 1, opacity: 0 },
        { strokeDashoffset: 0, opacity: 0.9, duration: 0.85, ease: "power2.out", stagger: 0.06 },
        0.12,
      );

      // Tendido, pulsos y dispositivos que se van sumando a la red.
      const rooms = ["#s5-r1", "#s5-r2", "#s5-r3", "#s5-r4", "#s5-r5"];
      [1, 2, 3, 4, 5].forEach((i, k) => {
        const t = 1.2 + k * 0.22;
        tl.fromTo("#s5-k" + i, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, t);
        tl.fromTo("#s5-q" + i, { strokeDashoffset: 0.12, opacity: 0 }, { strokeDashoffset: -1, opacity: 1, duration: 0.7, ease: "power2.inOut" }, t);
        tl.fromTo("#s5-q" + i, { strokeDashoffset: 0.12 }, { strokeDashoffset: -1, duration: 0.8, ease: "power1.inOut", immediateRender: false }, t + 1.5);
        tl.fromTo("#s5-n" + i, { scale: 0, opacity: 0, transformOrigin: "50% 50%" }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, t + 0.55);
        tl.fromTo(rooms[k], { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, t + 0.6);
      });
      tl.fromTo(
        "#s5-svg .cover",
        { scale: 0.2, opacity: 0, transformOrigin: "50% 50%" },
        { scale: 1, opacity: 1, duration: 1.3, ease: "power2.out", stagger: 0.25 },
        2.2,
      );

      // HUD.
      tl.fromTo("#s5-hud > *", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out", stagger: 0.06 }, 0.6);
      const el = document.getElementById("s5-n");
      const o = { v: 0 };
      tl.fromTo(o, { v: 0 }, { v: 100, duration: 2.0, ease: "power2.inOut", onUpdate: () => (el.textContent = Math.round(o.v)) }, 1.2);
      tl.fromTo("#s5-bar", { scaleX: 0 }, { scaleX: 1, duration: 2.0, ease: "power2.inOut" }, 1.2);

      // Titular.
      tl.fromTo(
        "#s5-text .w",
        { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.09 },
        1.0,
      );

      window.__timelines["s5"] = tl;
