  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#s2-wrap", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);

      // Travelling lateral por el living; al final acelera hacia el corte.
      tl.fromTo("#s2-cam", { x: -500 }, { x: -735, duration: 4.5, ease: "power1.out" }, 0);
      tl.fromTo("#s2-cam", { x: -735 }, { x: -1270, duration: 0.3, ease: "power3.in", immediateRender: false }, 4.5);

      // Las luces se encienden por zonas, sobre los pulsos de la música.
      const on = (v, t, r, d) =>
        tl.fromTo("#s2-lit", { [v]: "0px" }, { [v]: r + "px", duration: d, ease: "power2.out" }, t);
      on("--r1", 0.5, 1050, 0.75);
      on("--r2", 1.1, 1050, 0.75);
      on("--r3", 1.7, 1100, 0.75);
      ["--r1", "--r2", "--r3"].forEach((v, i) =>
        tl.fromTo("#s2-lit", { [v]: [1050, 1050, 1100][i] + "px" }, { [v]: "3000px", duration: 1.1, ease: "power2.inOut", immediateRender: false }, 2.3),
      );

      // Dispositivos conectados: nodos y trazas ortogonales.
      const node = (sel, t) => {
        tl.fromTo(sel + " b", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t);
        tl.fromTo(sel + " .ah-mono", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, t + 0.08);
      };
      node("#s2-n1", 0.62);
      tl.fromTo("#s2-p1", { strokeDashoffset: 1, opacity: 0.85 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 0.8);
      node("#s2-n2", 1.3);
      tl.fromTo("#s2-p2", { strokeDashoffset: 1, opacity: 0.85 }, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, 1.35);
      node("#s2-n3", 1.88);
      // Pulsos de datos que recorren las trazas.
      tl.fromTo("#s2-q1", { strokeDashoffset: 0.09, opacity: 0 }, { strokeDashoffset: -1, opacity: 1, duration: 0.9, ease: "power1.inOut" }, 2.4);
      tl.fromTo("#s2-q2", { strokeDashoffset: 0.09, opacity: 0 }, { strokeDashoffset: -1, opacity: 1, duration: 0.9, ease: "power1.inOut" }, 2.7);
      tl.fromTo("#s2-q1", { strokeDashoffset: 0.09 }, { strokeDashoffset: -1, duration: 0.9, ease: "power1.inOut", immediateRender: false }, 3.5);

      // Titular.
      tl.fromTo(
        "#s2-text .w",
        { opacity: 0, filter: "blur(10px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "power3.out", stagger: 0.1 },
        1.95,
      );
      tl.fromTo("#s2-text", { opacity: 1 }, { opacity: 0, duration: 0.22, ease: "power2.in", immediateRender: false }, 4.5);
      tl.fromTo("#s2-net, .s2-node", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in", immediateRender: false }, 4.45);

      window.__timelines["s2"] = tl;
    })();
